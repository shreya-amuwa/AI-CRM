name: Security (scheduled)

# Weekly re-check of things that change without a code change: newly published vulnerabilities in the dependencies,
# and the security suites against the current migrations. A failure e-mails the repository owner (GitHub's default
# notification for failed scheduled workflows); it is the alert, so do not silence it - fix or record the finding in
# docs/security/FINDINGS.md. Run it by hand from the Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC (08:47 IST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Build-time dependencies (report only)
        run: npm audit --audit-level=critical || echo "::warning::Build-time dependencies have known vulnerabilities - see the log above"

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - run: /tmp/gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

  database-security:
    name: Authorization, isolation and catalog invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: npm run test:security

  sast-registry:
    name: Semgrep community rules (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory: the community rule sets have not been tuned for this codebase yet. Review the log; turn real findings
    # into fixes or into project rules in .semgrep/rules.yml (which are blocking in CI).
    continue-on-error: true
    container:
      image: semgrep/semgrep:1.95.0
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/typescript --config p/nodejsscan --config p/react --metrics=off server api shared src
